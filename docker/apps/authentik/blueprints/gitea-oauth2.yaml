# Authentik blueprint: declarative OAuth2/OIDC provider + application for Gitea.
# Applied on boot (mounted at /blueprints/custom). The matching Gitea auth source is
# added once via the gitea CLI (auth sources live in Gitea's DB, not env). The source
# must be named "authentik" so its callback path matches the redirect URL below:
# /user/oauth2/authentik/callback.
version: 1
metadata:
  name: homelab - Gitea OAuth2
  labels:
    blueprints.goauthentik.io/description: Gitea SSO provider and application
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-gitea
    identifiers:
      name: gitea
    attrs:
      name: gitea
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: !Env GITEA_OAUTH_CLIENT_ID
      client_secret: !Env GITEA_OAUTH_CLIENT_SECRET
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      redirect_uris:
        - matching_mode: strict
          url:
            !Format [
              "https://gitea.%s/user/oauth2/authentik/callback",
              !Env APPS_DOMAIN,
            ]

  - model: authentik_core.application
    identifiers:
      slug: gitea
    attrs:
      name: Gitea
      slug: gitea
      provider: !KeyOf provider-gitea
      meta_launch_url: !Format ["https://gitea.%s", !Env APPS_DOMAIN]
      meta_description: Self-hosted Git
      group: Homelab
