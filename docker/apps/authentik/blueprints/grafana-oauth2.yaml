# Authentik blueprint: declarative OAuth2/OIDC provider + application for Grafana.
# Applied automatically on boot (mounted at /blueprints/custom). This keeps the SSO
# config reproducible and in version control instead of being clicked into the UI.
#
# Client id/secret come from the environment (!Env) so they match Grafana's own
# GF_AUTH_GENERIC_OAUTH_CLIENT_ID/SECRET in .env. The redirect URL is built from
# APPS_DOMAIN the same way.
version: 1
metadata:
  name: homelab - Grafana OAuth2
  labels:
    blueprints.goauthentik.io/description: Grafana SSO provider and application
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-grafana
    identifiers:
      name: grafana
    attrs:
      name: grafana
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: !Env GF_OAUTH_CLIENT_ID
      client_secret: !Env GF_OAUTH_CLIENT_SECRET
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://grafana.%s/login/generic_oauth", !Env APPS_DOMAIN]

  - model: authentik_core.application
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      slug: grafana
      provider: !KeyOf provider-grafana
      meta_launch_url: !Format ["https://grafana.%s", !Env APPS_DOMAIN]
      meta_description: Dashboards and observability
      group: Homelab
