# Authentik blueprint: declarative OAuth2/OIDC provider + application for the Proxmox VE
# hosts (the hypervisors, not an app in this stack). Applied on boot (mounted at
# /blueprints/custom). The matching realm is added once per cluster via the Proxmox CLI
# (auth realms live in /etc/pve, not env).
#
# Proxmox sends a redirect_uri equal to the web UI you browse to, including the
# (ex. https://pve-01:8006). This is a two-node cluster,
# so both node URLs are registered. PVE1_URL / PVE2_URL come from .env (!Env) and must match
# exactly how you reach each node's web interface.
version: 1
metadata:
  name: homelab - Proxmox OAuth2
  labels:
    blueprints.goauthentik.io/description: Proxmox VE SSO provider and application
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-proxmox
    identifiers:
      name: proxmox
    attrs:
      name: proxmox
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      client_id: !Env PVE_OAUTH_CLIENT_ID
      client_secret: !Env PVE_OAUTH_CLIENT_SECRET
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [
          authentik_crypto.certificatekeypair,
          [name, authentik Self-signed Certificate],
        ]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      redirect_uris:
        - matching_mode: strict
          url: !Env PVE1_URL
        - matching_mode: strict
          url: !Env PVE2_URL

  - model: authentik_core.application
    identifiers:
      slug: proxmox
    attrs:
      name: Proxmox VE
      slug: proxmox
      provider: !KeyOf provider-proxmox
      meta_launch_url: !Env PVE1_URL
      meta_description: Hypervisor cluster
      group: Homelab
