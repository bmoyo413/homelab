; CouchDB config for Obsidian Self-hosted LiveSync.
; Mounted read-write at /opt/couchdb/etc/local.d/ The admin user/password come from the
; COUCHDB_USER / COUCHDB_PASSWORD env (writes those into the admins section),
; so they are NOT set here. These settings are the values LiveSync needs to work.

[couchdb]
single_node = true
; LiveSync stores notes as many small docs/attachments; allow large requests.
max_document_size = 50000000

[chttpd]
require_valid_user = true
require_valid_user_except_for_up = true
max_http_request_size = 4294967296
x_forwarded_host = X-Forwarded-Host
x_forwarded_proto = X-Forwarded-Proto

[chttpd_auth]
require_valid_user = true
; LiveSync holds a session open; a longer timeout avoids frequent re-auth.
timeout = 7200

[httpd]
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
; The Obsidian app (desktop + iOS/Android) presents these origins.
origins = app://obsidian.md,capacitor://localhost,http://localhost
credentials = true
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600
