apiVersion: 1

# Dashboard provider. Loads JSON from the repo's grafana/dashboards/ (mounted
# read-only at /etc/grafana/dashboards), dashboards as code.
providers:
  - name: homelab
    orgId: 1
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: true
