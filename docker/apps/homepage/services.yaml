# Fun, credential-free live tiles via the customapi widget (public space APIs, no keys).
- Space:
    - ISS Live Tracker:
        icon: mdi-space-station
        href: https://wheretheiss.at/
        description: International Space Station, live
        widget:
          type: customapi
          url: https://api.wheretheiss.at/v1/satellites/25544
          refreshInterval: 5000
          method: GET
          mappings:
            - field: altitude
              label: Alt (km)
              format: number
            - field: velocity
              label: Speed km/h
              format: number
            - field: latitude
              label: Lat
              format: float
            - field: longitude
              label: Lon
              format: float
    - People in Space:
        icon: mdi-account-group
        href: https://corquaid.github.io/international-space-station-APIs/
        description: Humans off-planet right now
        widget:
          type: customapi
          url: https://corquaid.github.io/international-space-station-APIs/JSON/people-in-space.json
          refreshInterval: 3600000
          method: GET
          mappings:
            - field: number
              label: In Space
              format: number
            - field: iss_expedition
              label: ISS Exp.
              format: number
    # DEMO_KEY is NASA's public shared key (rate-limited ~50/day). Swap for a free
    # key from https://api.nasa.gov if it 429s. Drop this tile if you don't want it.
    - Astronomy Pic of the Day:
        icon: mdi-telescope
        href: https://apod.nasa.gov/apod/
        description: NASA APOD
        widget:
          type: customapi
          url: https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY
          refreshInterval: 3600000
          method: GET
          mappings:
            - field: title
              label: Today
              format: text
            - field: date
              label: Date
              format: date
